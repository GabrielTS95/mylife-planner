<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script th:src="@{/js/theme.js}"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar cuota | MyLife Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/finance-cycle.css}">
</head>
<body class="dashboard-shell finance-cycle-page">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="dashboard-main">
  <header class="home-topbar"><div><h1>Editar cuota pendiente</h1><p>Los cambios se aplican únicamente a esta cuota.</p></div><a th:href="@{/finances/cycle}" class="btn btn-outline-secondary">Volver a Mi ciclo</a></header>
  <section class="card-panel p-4">
    <form method="post" th:action="@{/finances/cycle/payments/{id}/edit(id=${paymentId})}" th:object="${paymentForm}">
      <div th:replace="~{finances/payment-fields :: fields}"></div>
      <div class="d-flex gap-2 mt-4"><button class="btn btn-success" type="submit">Guardar cuota</button><a th:href="@{/finances/cycle}" class="btn btn-outline-secondary">Cancelar</a></div>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/alerts :: alerts}"></div>
</body>
</html>
