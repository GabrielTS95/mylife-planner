<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta | MyLife Planner</title>
  <script th:src="@{/js/theme.js}"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-shell">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="dashboard-main">
  <section class="card-panel"><h1 class="h3">Mi cuenta</h1>
    <p>Usa el menú para acceder a tus pestañas. Si no tienes ninguna habilitada, solicita acceso al administrador.</p>
    <a class="btn btn-primary" th:href="@{/account/password}">Cambiar contraseña</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
