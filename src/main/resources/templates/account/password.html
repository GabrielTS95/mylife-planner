<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña | MyLife Planner</title>
  <script th:src="@{/js/theme.js}"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/settings.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body class="dashboard-shell">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="dashboard-main">
  <section class="card-panel account-card">
    <h1 class="h3">Cambiar contraseña</h1>
    <p th:if="${temporaryPassword}">Antes de continuar, reemplaza tu contraseña temporal por una que solo tú conozcas.</p>
    <p th:unless="${temporaryPassword}">Al cambiar tu contraseña se cerrarán tus sesiones. Vuelve a ingresar con la nueva.</p>
    <div th:if="${passwordError}" class="alert alert-danger" role="alert" th:text="${passwordError}"></div>
    <form method="post" th:action="@{/account/password}" class="vstack gap-3">
      <div><label for="currentPassword" class="form-label" th:text="${temporaryPassword} ? 'Contraseña temporal' : 'Contraseña actual'"></label>
        <input id="currentPassword" class="form-control" type="password" name="currentPassword" autocomplete="current-password" required></div>
      <div><label for="newPassword" class="form-label">Nueva contraseña</label>
        <input id="newPassword" class="form-control" type="password" name="newPassword" minlength="12" maxlength="72" autocomplete="new-password" required aria-describedby="passwordHelp">
        <small id="passwordHelp" class="text-muted">Usa una frase de al menos 12 caracteres. No repitas tu contraseña temporal.</small></div>
      <div><label for="confirmation" class="form-label">Repetir nueva contraseña</label>
        <input id="confirmation" class="form-control" type="password" name="confirmation" minlength="12" maxlength="72" autocomplete="new-password" required></div>
      <button class="btn btn-primary" type="submit">Guardar nueva contraseña</button>
    </form>
  </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
